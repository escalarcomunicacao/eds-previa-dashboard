.client-theme .button.primary {
  background: var(--client-accent, #b12e20);
  border-color: var(--client-accent, #b12e20);
  color: #fff;
}
.client-theme .button.primary:hover { filter: brightness(.88); }
.client :focus-visible, .client-theme :focus-visible, .client .search:focus-within {
  outline-color: var(--client-accent, #b12e20);
}
.client .mark, .client .tab.active {
  background: color-mix(in srgb, var(--client-accent) 11%, #fff8f0);
  color: color-mix(in srgb, var(--client-accent) 76%, #39190e);
}
.client .tab.active, .client .food-card:hover {
  border-color: color-mix(in srgb, var(--client-accent) 34%, #fff8f0);
}
.client .food-card strong { color: color-mix(in srgb, var(--client-accent) 80%, #39190e); }

.sr-only, .queue-mobile-label {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.queue-toolbar .tabs { margin: 0; }
.queue-toolbar { margin-bottom: 13px; }
.queue-toolbar label { font-size: .9rem; font-weight: 700; }
.queue-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 15px; }
.queue-lane {
  --stage-ink: #754310;
  --stage-bg: #fff2da;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fcf7f2;
  min-width: 0;
  overflow: hidden;
}
.queue-lane.preparing { --stage-ink: #5f3971; --stage-bg: #f1e8f7; }

  for(let i=0;i<size;i++){mark(6,i,i%2===0);mark(i,6,i%2===0);}

const dialog = document.querySelector('#dialog');
const announcement = document.querySelector('#announcement');
const labels = {overview:'Visão geral', orders:'Pedidos', tables:'Mesas', reservations:'Reservas', tabs:'Comandas', queue:'Fila de pedidos', catalog:'Cardápio', team:'Equipe e setores', reports:'Relatórios', settings:'Estabelecimento', review:'Roteiro de teste'};
const glyphs = {overview:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',orders:'M5 4h14v17l-3-2-4 2-4-2-3 2zM8 8h8M8 12h8',tables:'M3 7h18v4H3zM6 11v8m12-8v8M4 15h16',reservations:'M4 5h16v16H4zM8 3v4m8-4v4M4 10h16',tabs:'M5 4h14v16H5zM8 9h8m-8 4h8m-8 4h5',queue:'M3 4h18v13H3zM8 21h8m-4-4v4',catalog:'M5 3v8m3-8v8m3-8v8m-6-4h6m-3 4v10M17 3c-2 2-3 4-3 9h4m0-9v18',team:'M16 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M14 7a3 3 0 1 1-6 0 3 3 0 1 1 6 0zM17 5a3 3 0 0 1 0 6m4 9v-2a4 4 0 0 0-3-4',reports:'M4 4v16h16M8 16v-4m5 4V8m5 8v-6',settings:'M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-6 2v4',review:'M9 5H5v16h14V5h-4M9 3h6v4H9zM8 12l2 2 5-4m-7 7h8',cart:'M3 4h2l2 11h11l3-8H6m3 12h.01M17 19h.01',bell:'M5 16h14l-2-3V9a5 5 0 0 0-10 0v4zm5 3a2 2 0 0 0 4 0',search:'M16 16l5 5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0z',more:'M5 12h.01M12 12h.01M19 12h.01',plus:'M12 5v14M5 12h14',minus:'M5 12h14',close:'m6 6 12 12M18 6 6 18',eye:'M2 12s3-6 10-6 10 6 10 6-3 6-10 6-10-6-10-6zm13 0a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',qr:'M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0v3h3m4-3v7h-7',up:'m5 14 7-7 7 7',down:'m5 10 7 7 7-7',check:'m4 12 5 5L20 6',link:'M10 13a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-2 2m2 6a4 4 0 0 0-6 0l-4 4a4 4 0 0 0 6 6l2-2'};
const icon = key => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${glyphs[key] || glyphs.catalog}"/></svg>`;
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (items, id) => items.find(item => item.id === id);
const statesInProgress = ['new','preparing','ready'];
const state = getState();
let role = roles[sessionStorage.getItem('emenu-role')] ? sessionStorage.getItem('emenu-role') : 'manager';
let route;
let toastTimer;
let currentModal;
let menuSearch = '';
let menuCategory = '';
let orderView = 'active';
let sectorFilter = '';
let catalogView = 'products';
let teamView = 'staff';
let reservationView = 'active';
let queueView = 'panel';
let queueSector = '';
let reportView = 'day';
let reportStart = day();
let reportEnd = day();
let clientCode = '';

function routeFromHash() {
  const [path, query] = location.hash.slice(1).split('?');
  const params = new URLSearchParams(query);
  if (path === 'cardapio') return {page:'client', id:params.get('r'), check:params.get('c')};
  if (path === 'tela') return {page:'display', id:params.get('r'), screen:params.get('s')};
  if (path === 'comanda') return {page:'tabs', detail:params.get('id')};
  return {page:Object.keys(labels).find(key => key === path) || roles[role].start};
}

function restaurant() {
  return byId(state.restaurants, route?.id || state.active) || state.restaurants[0];
}

const isManager = () => role === 'manager';
const managesChecks = () => role === 'manager' || role === 'waiter';
const canReserve = () => role !== 'cook';
const screenName = (r, id) => byId(r.screens,id)?.name || 'Tela sem configuração';
const tableName = (r, id) => byId(r.tables,id)?.name || 'Mesa removida';
const sectorName = (r, id) => byId(r.sectors,id)?.name || 'Sem setor';
const dateLabel = value => value ? value.split('-').reverse().join('/') : '';
const timeLabel = value => value ? clock(new Date(value)) : '';
const totalLines = lines => lines.reduce((total,item) => total + item.price * item.quantity, 0);
const allowedColor = (value, fallback) => /^#[0-9a-f]{6}$/i.test(value || '') ? value : fallback;

function safeImage(value) {
  if (/^data:image\/(?:png|jpeg|webp|gif);base64,[a-z0-9+/=]+$/i.test(value || '')) return value;
  if (!value) return '';
  try { const url = new URL(value); return url.protocol === 'https:' ? url.href : ''; }
  catch { return ''; }
}

function btn(label, action, options = {}) {
  const {className='', id, value, symbol, disabled=false, hide=false} = options;
  return `<button type="button" class="button ${className}" data-action="${action}"${id !== undefined ? ` data-id="${esc(id)}"` : ''}${value !== undefined ? ` data-value="${esc(value)}"` : ''}${disabled ? ' disabled' : ''}${hide ? ` aria-label="${esc(label)}" title="${esc(label)}"` : ''}>${symbol ? icon(symbol) : ''}${hide ? '' : esc(label)}</button>`;
}

function link(label, href, symbol, className = '') {
  return `<a class="button ${className}" href="${esc(href)}">${symbol ? icon(symbol) : ''}${esc(label)}</a>`;
}

const tag = (status, label=statusNames[status] || status) => `<span class="tag ${esc(status)}"><span class="dot"></span>${esc(label)}</span>`;
const empty = label => `<div class="empty">${esc(label)}</div>`;
const panel = (title, body, description='') => `<section class="panel"><header class="panel-head"><h2>${esc(title)}</h2>${description ? `<p class="small">${esc(description)}</p>` : ''}</header>${body}</section>`;
const field = (label, body, extra='') => `<label class="field ${extra}"><span>${esc(label)}</span>${body}</label>`;
const input = (name, value='', attrs='') => `<input name="${name}" value="${esc(value)}" ${attrs}>`;
const textarea = (name, value='') => `<textarea name="${name}" maxlength="240">${esc(value)}</textarea>`;
const options = (items, selected) => items.map(([id,name]) => `<option value="${esc(id)}"${id === selected ? ' selected' : ''}>${esc(name)}</option>`).join('');
const select = (name, rows, value='', attrs='') => `<select name="${name}" ${attrs}>${options(rows,value)}</select>`;
const choiceRows = items => items.map(item => [item.id,item.name]);
const placeholderOption = (label, items) => [['',label],...choiceRows(items)];
const categoryOf = (r,p) => byId(r.categories,p.category);
const clientHref = (r, code) => `#cardapio?r=${encodeURIComponent(r.id)}${code ? `&c=${encodeURIComponent(code)}` : ''}`;
const displayHref = (r, id) => `#tela?r=${encodeURIComponent(r.id)}&s=${encodeURIComponent(id || '')}`;

function pageHead(title, description, actions='') {
  return `<header class="spread align-start pagehead"><div><h1>${esc(title)}</h1><p class="subtle">${esc(description)}</p></div><div class="header-actions">${actions}</div></header>`;
}

function tabs(items, active, action) {
  return `<div class="tabs">${items.map(([id,label]) => `<button type="button" class="tab${id === active ? ' active' : ''}" data-action="${action}" data-value="${esc(id)}" aria-pressed="${id === active}">${esc(label)}</button>`).join('')}</div>`;
}

function photo(value, className='', loading='lazy') {
  const url = safeImage(value);
  return url ? `<img class="${className}" src="${esc(url)}" alt="" loading="${loading}">` : `<span class="food-placeholder ${className}">${icon('catalog')}</span>`;
}

function notify(message) {
  clearTimeout(toastTimer);
  announcement.textContent = message;
  announcement.classList.add('show');
  toastTimer = setTimeout(() => announcement.classList.remove('show'), 3600);
}

function persist(message) {
  const saved = writeState(state);
  render();
  if (message) notify(saved ? message : `${message} Alterações nesta sessão apenas.`);
}

function openModal(title, body, footer = '', onSubmit) {
  currentModal = {onSubmit};
  dialog.innerHTML = `<header class="modal-head spread"><h2 id="dialog-title">${esc(title)}</h2>${btn('Fechar','dismiss',{symbol:'close',hide:true,className:'quiet icon-button'})}</header>${onSubmit ? '<form class="modal-body">' : '<div class="modal-body">'}${body}<p id="modal-error" class="error" role="alert" hidden></p>${footer ? `<footer class="modal-foot">${footer}</footer>` : ''}${onSubmit ? '</form>' : '</div>'}`;
  if (!dialog.open) dialog.showModal();
  dialog.querySelector('form')?.addEventListener('submit', event => {
    event.preventDefault();
    modalError('');
    currentModal?.onSubmit(new FormData(event.currentTarget), event.currentTarget);
  });
}

function modalError(message) {
  const error = dialog.querySelector('#modal-error');
  error.textContent = message;
  error.hidden = !message;
}

const submit = (label, style='primary') => `<button class="button ${style}" type="submit">${esc(label)}</button>`;
const cancel = () => btn('Cancelar','dismiss');

function confirmAction(title, text, label, callback, style='danger') {
  openModal(title, `<p class="subtle">${esc(text)}</p>`, cancel()+submit(label,style), callback);
}

function complete(message) {
  dialog.close();
  persist(message);
}

function showForm(title, body, callback, label='Salvar') {
  openModal(title, `<div class="form-grid">${body}</div>`, cancel()+submit(label), callback);
}

function navLink(key, page) {
  const active = page === key;
  return `<a class="navlink${active ? ' active' : ''}" href="#${key}"${active ? ' aria-current="page"' : ''}>${icon(key)}${esc(labels[key])}</a>`;
}

function shell(r, page, inner) {
  const brand = `<span class="mark">${r.logo ? photo(r.logo) : icon('catalog')}</span>`;
  const clientUrl = clientHref(r,r.checks.find(c=>c.status==='open')?.code);
  const navigation = roles[role].tabs;
  return `<div class="app-layout"><header class="app-header"><div class="app-header-inner"><a class="app-brand" href="#${roles[role].start}">${brand}<span class="wordmark">eMenu</span></a><span class="app-restaurant">${esc(r.name)}</span><div class="app-header-actions"><span class="demo">Demonstração</span><label class="role"><span>Perfil</span><span class="avatar">${roles[role].initials}</span>${select('role',Object.entries(roles).map(([id,entry])=>[id,entry.name]),role,'aria-label="Perfil da demonstração"')}</label><a class="button client-shortcut" href="${clientUrl}">${icon('eye')}Vista do cliente</a></div></div><nav class="app-nav" aria-label="Navegação principal">${navigation.map(key=>navLink(key,page)).join('')}</nav></header><main class="work" id="conteudo" tabindex="-1">${inner}</main></div>`;
}

function navigate(href) {
  if (location.hash === href) render();
  else location.hash = href;
}

function render() {
  route = routeFromHash();
  const r = restaurant();
  dialog.classList.toggle('client-theme',route.page==='client');
  if (route.page === 'client') {
    dialog.style.setProperty('--client-accent',allowedColor(r.accent,menuPalette.accent));
    app.innerHTML = renderClient(r);
    return;
  }
  if (route.page === 'display') { app.innerHTML = renderDisplay(r); return; }
  const page = roles[role].tabs.includes(route.page) ? route.page : roles[role].start;
  const renderers = {overview:renderOverview, orders:renderOrders, tables:renderTables, reservations:renderReservations, tabs:renderChecks, queue:renderQueue, catalog:renderCatalog, team:renderTeam, reports:renderReports, settings:renderSettings, review:renderReview};
  app.innerHTML = shell(r,page,renderers[page](r));
  if (page === 'catalog') bindCatalogPlaylists(r);
}

function ticket(r, order, interactive) {
  const check = byId(r.checks,order.check);
  const next = {new:['preparing','Iniciar preparo'],preparing:['ready','Marcar pronto'],ready:['delivered','Confirmar entrega']}[order.status];
  const canAdvance = interactive && next && ((role === 'cook' && order.status !== 'ready') || (role === 'waiter' && order.status === 'ready') || isManager());
  return `<article class="ticket"><div class="spread"><h3>${esc(tableName(r,check?.table))}</h3><small>#${order.number}</small></div><ul>${order.items.map(item=>`<li><strong>${item.quantity}×</strong> ${esc(item.name)}${item.note ? `<br><small>${esc(item.note)}</small>` : ''}</li>`).join('')}</ul><div class="meta spread"><span>${esc(sectorName(r,order.sector))}</span><span>${timeLabel(order.created)}</span></div>${canAdvance ? btn(next[1],'advance',{id:order.id,value:next[0],className:'tiny'}) : ''}${interactive && isManager() && statesInProgress.includes(order.status) ? btn('Cancelar pedido','cancel-order',{id:order.id,className:'tiny danger quiet'}) : ''}</article>`;
}

function board(r, orders, interactive = true, compact = false) {
  const columns = [['new','Recebidos'],['preparing','Em preparo'],['ready','Prontos']];
  return `<div class="board${compact ? ' compact' : ''}">${columns.map(([status,label])=>{
    const tickets = orders.filter(order=>order.status === status);
    return `<section class="column"><div class="column-head"><span class="dot"></span>${label}<span class="amount">${tickets.length}</span></div>${tickets.map(order=>ticket(r,order,interactive)).join('') || '<p class="empty-lane">Sem pedidos</p>'}</section>`;
  }).join('')}</div>`;
}

function metric(label, value, description, symbol) {
  return `<article class="panel metric"><div class="spread"><div class="grow">${esc(label)}<strong>${esc(value)}</strong></div><span class="ico">${icon(symbol)}</span></div><small>${esc(description)}</small></article>`;
}

function renderOverview(r) {
  const tables = r.tables.filter(t=>!t.archived);
  const active = r.orders.filter(o=>statesInProgress.includes(o.status));
  const revenue = r.checks.filter(c=>c.status==='ended' && c.closed && day(new Date(c.closed))===day()).reduce((sum,c)=>sum+c.paid,0);
  const todayReservations = r.reservations.filter(res=>res.date===day() && ['confirmed','arrived'].includes(currentReservation(res))).length;
  const sample = r.checks.find(check=>check.status==='open');
  const tableCards = tables.slice(0,9).map(t=>`<button class="table-mini ${tableStatus(r,t)}" data-action="table-detail" data-id="${esc(t.id)}">${icon('tables')}<strong>${esc(t.name)}</strong></button>`).join('');
  const upcoming = r.reservations.filter(res=>['confirmed','arrived'].includes(currentReservation(res))).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).slice(0,3);
  return pageHead('Visão geral','Veja os pedidos em andamento e acompanhe as mesas do salão.',link('Abrir cardápio',clientHref(r,sample?.code),'eye'))+
    `<section class="hero"><div><div class="eyebrow">Visão da operação</div><h2>${esc(r.name)}</h2><p>${esc(r.subtitle)}</p></div>${link('Acompanhar pedidos','#orders','orders','light')}</section><section class="metrics" aria-label="Indicadores">${metric('Mesas ocupadas',`${tables.filter(t=>tableStatus(r,t)==='occupied').length} / ${tables.length}`,'Mesas ativas no salão','tables')}${metric('Pedidos em andamento',active.length,'Recebidos, em preparo ou prontos','orders')}${metric('Reservas de hoje',todayReservations,'Reservas ativas','reservations')}${metric('Recebido hoje',money(revenue),'Comandas pagas','reports')}</section><div class="overview-grid">${panel('Pedidos em andamento',board(r,active,false,true),'Acompanhe os setores de preparo.')}<div class="overview-secondary">${panel('Mapa do salão',`<div class="panel-body"><div class="table-preview">${tableCards || empty('Cadastre uma mesa.')}</div><div class="legend"><span><i class="dot"></i>Livre</span><span><i class="dot"></i>Ocupada</span><span><i class="dot"></i>Reservada</span></div></div>`)}${panel('Próximas reservas',upcoming.map(res=>`<div class="list-row"><div><h3>${esc(res.name)}</h3><p class="small">${esc(tableName(r,res.table))} · ${dateLabel(res.date)} às ${esc(res.start)}</p></div>${tag(currentReservation(res))}</div>`).join('') || `<div class="panel-body">${empty('Sem reservas ativas.')}</div>`)}</div></div>`;
}

function renderOrders(r) {
  const assigned = role === 'cook' ? (r.staff.find(s=>s.role==='cook' && s.active)?.sectors || []) : [];
  const visibleSectors = role === 'cook' && assigned.length ? r.sectors.filter(s=>assigned.includes(s.id)) : r.sectors;
  const validFilter = visibleSectors.some(s=>s.id===sectorFilter) ? sectorFilter : '';
  const orders = r.orders.filter(o=>(role!=='cook' || !assigned.length || assigned.includes(o.sector)) && (!validFilter || o.sector===validFilter));
  const calls = r.calls.filter(c=>c.status==='open');
  const callList = managesChecks() && calls.length ? panel('Chamados de garçom',calls.map(call=>`<div class="list-row"><div class="list-title"><span class="ico">${icon('bell')}</span><div><h3>${esc(tableName(r,call.table))}</h3><p class="small">Chamado às ${timeLabel(call.created)}${call.fee ? ` · ${money(call.fee)} após atendimento` : ''}</p></div></div>${btn('Concluir atendimento','handle-call',{id:call.id,className:'tiny'})}</div>`).join('')) : '';
  const history = orders.filter(o=>o.status===orderView).sort((a,b)=>b.created.localeCompare(a.created));
  return pageHead('Pedidos','Acompanhe o preparo, a entrega e os chamados do salão.')+`<div class="spread toolbar"><div>${tabs([['active','Em andamento'],['delivered','Entregues'],['cancelled','Cancelados']],orderView,'order-view')}</div><label>Setor ${select('sector-filter',placeholderOption('Todos os setores',visibleSectors),validFilter)}</label></div><div class="stack">${callList}${orderView==='active' ? `<section class="panel">${board(r,orders)}</section>` : history.length ? `<div class="tiles">${history.map(o=>ticket(r,o,true)).join('')}</div>` : empty('Nenhum pedido neste filtro.')}</div>`;
}

function renderTables(r) {
  return pageHead('Mesas','Consulte a ocupação e acesse as comandas por mesa.',isManager() ? btn('Nova mesa','table-form',{symbol:'plus',className:'primary'}) : '')+
  `<div class="tiles">${r.tables.map(t=>{
    const status = tableStatus(r,t);
    return `<article class="panel tile"><div class="spread"><h2>${esc(t.name)}</h2>${tag(status)}</div><p class="small">${t.seats} lugares</p><div class="tile-actions">${btn('Ver mesa','table-detail',{id:t.id,symbol:'eye',className:'tiny'})}${isManager() ? btn('Editar mesa','table-form',{id:t.id,symbol:'more',hide:true,className:'tiny'}) : ''}</div></article>`;
  }).join('') || empty('Nenhuma mesa cadastrada.')}</div>`;
}

function renderReservations(r) {
  const active = res=>['confirmed','arrived'].includes(currentReservation(res));
  const rows = r.reservations.filter(res=>reservationView==='active' ? active(res) : !active(res)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  return pageHead('Reservas','Organize os horários, confirme chegadas e consulte o histórico.',btn('Agendar reserva','reservation-form',{symbol:'plus',className:'primary'}))+tabs([['active','Ativas'],['history','Histórico']],reservationView,'reservation-view')+
  panel(reservationView==='active' ? 'Agenda de reservas' : 'Histórico de reservas',rows.length ? rows.map(res=>`<article class="list-row"><div class="list-title"><span class="ico">${icon('reservations')}</span><div><h3>${esc(res.name)}</h3><p class="small">${esc(tableName(r,res.table))} · ${res.party} ${res.party===1?'pessoa':'pessoas'} · ${dateLabel(res.date)} · ${esc(res.start)}–${esc(res.end)}</p></div></div><div class="row">${tag(currentReservation(res))}${btn('Ver reserva','reservation-detail',{id:res.id,className:'tiny'})}</div></article>`).join('') : `<div class="panel-body">${empty('Nenhuma reserva neste filtro.')}</div>`);
}

function renderChecks(r) {
  const check = byId(r.checks,route.detail);
  if (check) return renderCheckDetail(r,check);
  return pageHead('Comandas','Acompanhe os pedidos entregues e finalize o pagamento.',btn('Abrir comanda','check-form',{symbol:'plus',className:'primary'}))+
  panel('Comandas do salão',r.checks.length ? [...r.checks].sort((a,b)=>Number(a.status!=='open')-Number(b.status!=='open')).map(c=>`<article class="list-row"><div class="list-title"><span class="ico">${icon('tabs')}</span><div><h3>${esc(c.name)}</h3><p class="small">${esc(tableName(r,c.table))} · Código ${esc(c.code)}</p></div></div><div class="row">${tag(c.status)}<strong>${money(c.status==='ended'?c.paid:checkTotals(r,c.id).total)}</strong>${link('Ver comanda',`#comanda?id=${encodeURIComponent(c.id)}`,'eye','tiny')}</div></article>`).join('') : `<div class="panel-body">${empty('Nenhuma comanda cadastrada.')}</div>`);
}

function renderCheckDetail(r,c) {
  const assignedStaff = byId(r.staff,c.staff);
  const assignedName = assignedStaff?.name || (c.staff ? 'Funcionário indisponível' : 'Sem garçom atribuído');
  const responsible = `<section class="panel panel-body row check-assignee" aria-label="Garçom responsável"><span class="check-assignee-icon">${icon('team')}</span><div><p class="small">Garçom responsável</p><h2>${esc(assignedName)}</h2>${assignedStaff?.active===false?'<p class="small">Cadastro do funcionário inativo</p>':''}</div></section>`;
  const totals = checkTotals(r,c.id);
  const pending = totals.orders.some(o=>statesInProgress.includes(o.status)) || r.calls.some(call=>call.check===c.id && call.status==='open');
  const orderRows = totals.orders.map(o=>`<div class="list-row"><div><h3>Pedido #${o.number}</h3><p class="small">${o.items.map(i=>`${i.quantity}× ${esc(i.name)}`).join(' · ')}</p></div><div class="row">${tag(o.status)}<strong>${money(orderValue(o))}</strong></div></div>`).join('');
  const summary = `<div class="summary"><div class="spread"><span>Produtos entregues</span><strong>${money(totals.delivered)}</strong></div><div class="spread"><span>Pedidos em andamento</span><strong>${money(totals.pending)}</strong></div><div class="spread"><span>Chamados atendidos</span><strong>${money(totals.fees)}</strong></div><div class="spread total"><span>${c.status==='ended'?'Total pago':'Total a pagar'}</span><strong>${money(c.status==='ended'?c.paid:totals.total)}</strong></div></div>${c.status==='open' ? `<p class="small">${pending?'Conclua ou cancele os pedidos e atenda os chamados antes de fechar a comanda.':'O pagamento registra o valor e encerra esta comanda.'}</p>${btn('Realizar pagamento','pay',{id:c.id,symbol:'check',className:'primary',disabled:pending})}` : `<p class="small">${esc(c.method || 'Encerrada')} · ${dateLabel(day(new Date(c.closed)))} às ${timeLabel(c.closed)}</p>`}`;
  return pageHead(c.name,`${tableName(r,c.table)} · Código ${c.code}`,link('Voltar a comandas','#tabs')+(c.status==='open'?btn('QR Code','qr',{id:c.id,symbol:'qr'}):''))+responsible+`<div class="detail-grid">${panel('Pedidos da comanda',orderRows || `<div class="panel-body">${empty('Ainda não há pedidos nesta comanda.')}</div>`)}${panel('Pagamento',`<div class="panel-body stack">${tag(c.status)}${summary}</div>`)}</div>`;
}

function queueRows(r,screen) {
  const sectorIds = r.sectors.filter(s=>s.screen===screen).map(s=>s.id);
  return r.orders.filter(o=>statesInProgress.includes(o.status) && (screen===r.queueScreen || sectorIds.includes(o.sector)))
    .sort((first,second)=>first.created.localeCompare(second.created))
    .map(o=>({number:o.number,table:tableName(r,byId(r.checks,o.check)?.table),sector:sectorName(r,o.sector),sectorId:o.sector,status:o.status,created:o.created}));
}

const queueStages = [
  ['new','Recebidos','Nenhum pedido aguardando preparo.'],
  ['preparing','Em preparo','Nenhum pedido em preparo.'],
  ['ready','Prontos para entrega','Nenhum pedido pronto para entrega.']
];

function queueCards(rows) {
  return `<div class="queue-board">${queueStages.map(([status,label,emptyLabel])=>{
    const inStage=rows.filter(row=>row.status===status);
    const cards=inStage.map(row=>`<li><div class="queue-ticket-id"><span>Pedido #${row.number}</span><strong>${esc(row.table)}</strong></div><div class="queue-ticket-meta"><span>${esc(row.sector)}</span><time datetime="${esc(row.created)}">${timeLabel(row.created)}</time></div></li>`).join('');
    return `<section class="queue-lane ${status}"><header><h3>${label}</h3><span class="queue-count" aria-label="${inStage.length} ${inStage.length===1?'pedido':'pedidos'}">${inStage.length}</span></header>${cards?`<ul>${cards}</ul>`:`<p class="queue-empty">${emptyLabel}</p>`}</section>`;
  }).join('')}</div>`;
}

function queueList(rows) {
  if (!rows.length) return `<div class="panel-body">${empty('Nenhum pedido ativo neste setor.')}</div>`;
  const priority=['ready','new','preparing'];
  const ordered=[...rows].sort((first,second)=>priority.indexOf(first.status)-priority.indexOf(second.status));
  const entries=ordered.map(row=>`<li class="queue-list-row"><div><strong>${esc(row.table)}</strong><span class="small">Pedido #${row.number}</span></div><div><span class="queue-mobile-label">Setor</span>${esc(row.sector)}</div><div><span class="queue-mobile-label">Recebido às</span><time datetime="${esc(row.created)}">${timeLabel(row.created)}</time></div><div>${tag(row.status,row.status==='ready'?'Pronto para entrega':statusNames[row.status])}</div></li>`).join('');
  return `<div class="queue-list-head" aria-hidden="true"><span>Mesa e pedido</span><span>Setor</span><span>Recebido às</span><span>Status</span></div><ul class="queue-list">${entries}</ul>`;
}

function screenLink(r,id,label) {
  return `<a class="button" href="${esc(displayHref(r,id))}" target="_blank" rel="noopener">${icon('queue')}${esc(label)}<span class="sr-only"> (nova aba)</span></a>`;
}

function queueScreens(r) {
  return `<div class="tiles queue-screens">${r.screens.map(screen=>{
    const isHall=screen.id===r.queueScreen;
    const sectors=r.sectors.filter(sector=>sector.screen===screen.id);
    const count=queueRows(r,screen.id).length;
    const scope=isHall?'Todos os setores':sectors.map(sector=>sector.name).join(', ') || 'Nenhum setor vinculado';
    return `<article class="panel tile"><div class="spread"><span class="queue-screen-icon">${icon('queue')}</span>${isHall?'<span class="tag ready">Fila geral</span>':''}</div><h2>${esc(screen.name)}</h2><p class="small">${esc(scope)}</p><div class="spread"><span class="small">${count} ${count===1?'pedido ativo':'pedidos ativos'}</span>${screenLink(r,screen.id,'Abrir tela')}</div></article>`;
  }).join('') || empty('Nenhuma tela cadastrada.')}</div>`;
}

function renderQueue(r) {
  const selectedSector=byId(r.sectors,queueSector);
  const rows=queueRows(r,r.queueScreen).filter(row=>!selectedSector || row.sectorId===selectedSector.id);
  const head=pageHead('Fila de pedidos','Veja o que aguarda preparo, está na cozinha ou no bar e já pode sair para a mesa.',link('Gerenciar pedidos','#orders','orders')+screenLink(r,r.queueScreen,'Abrir tela do salão'));
  const controls=tabs([['panel','Painel da fila'],['list','Lista de pedidos'],['screens','Telas por setor']],queueView,'queue-view');
  if (queueView==='screens') return head+controls+queueScreens(r);
  return head+`<div class="spread queue-toolbar">${controls}<label class="row">Setor ${select('queue-sector',placeholderOption('Todos os setores',r.sectors),selectedSector?.id || '')}</label></div>`+
    panel(queueView==='panel'?'Pedidos em andamento':'Pedidos ativos',queueView==='panel'?queueCards(rows):queueList(rows),`${rows.length} ${rows.length===1?'pedido ativo':'pedidos ativos'}${selectedSector?' · '+selectedSector.name:''}`);
}

function renderDisplay(r) {
  const screen = byId(r.screens,route.screen) || byId(r.screens,r.queueScreen);
  return `<div class="queue-display"><header class="topbar"><div class="row"><span class="mark">${icon('queue')}</span><strong class="title-break">${esc(r.name)}</strong><span class="demo">Demonstração</span></div><div class="row">${btn('Tela cheia','fullscreen')}${link('Voltar à fila','#queue')}</div></header><main class="work" id="conteudo" tabindex="-1">${pageHead(screen?.name || 'Painel de pedidos','Acompanhe o andamento dos pedidos desta tela.')}${queueCards(queueRows(r,screen?.id))}</main></div>`;
}

const normalize = value => value.normalize('NFD').replace(/\p{Diacritic}/gu,'').toLocaleLowerCase('pt-BR');
const openCheck = (r,code) => r.checks.find(c=>c.code===code && c.status==='open');
const cartFor = (r,code) => r.carts[code || '_guest'] || [];

function renderClient(r) {
  const code = route.check || '';
  const check = openCheck(r,code);
  const cart = cartFor(r,code);
  const count = cart.reduce((sum,item)=>sum+item.quantity,0);
  const hero = safeImage(r.products.find(p=>p.active && p.image)?.image || photos.burger);
  const header = `<div class="clientbar"><div class="clientbar-inner spread"><a href="${clientHref(r,code)}" class="clientbrand"><span class="mark">${r.logo?photo(r.logo):icon('catalog')}</span><span class="title-break">${esc(r.name)}</span></a><div class="row">${btn('Comanda','client-check',{symbol:'tabs'})}<button type="button" class="button primary" data-action="cart" aria-label="Carrinho, ${count} ${count===1?'item':'itens'}">${icon('cart')}<span>Carrinho</span><span aria-hidden="true">${count}</span></button></div></div></div>`;
  const categories = r.categories.filter(cat=>r.products.some(p=>p.active && p.category===cat.id));
  const activeCategory = categories.some(c=>c.id===menuCategory) ? menuCategory : '';
  const categoriesHtml = categories.filter(cat=>!activeCategory || cat.id===activeCategory).map(cat=>{
    const matching = r.products.filter(p=>p.active && p.category===cat.id && normalize(`${p.name} ${p.description} ${cat.name}`).includes(normalize(menuSearch.trim())));
    return matching.length ? `<section class="category-group"><h2>${esc(cat.name)}</h2><div class="menu-grid">${matching.map(p=>`<button type="button" class="food-card" data-action="product" data-id="${esc(p.id)}"><span><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><strong>${money(p.price)}</strong></span>${photo(p.image)}</button>`).join('')}</div></section>` : '';
  }).join('');
  const callLabel = r.callFee ? `Chamar garçom · ${money(r.callFee)}` : 'Chamar garçom';
  const note = check ? `${tableName(r,check.table)} · Comanda ${check.code}` : code ? `Comanda ${code} indisponível` : 'Cardápio digital';
  return `<div class="client" style="--client-accent:${allowedColor(r.accent,menuPalette.accent)};--client-bg:${allowedColor(r.background,menuPalette.background)}">${header}<main id="conteudo" class="clientwrap" tabindex="-1"><section class="clienthero" style="--hero-image:url('${esc(hero.replaceAll("'","%27"))}')"><div><div class="eyebrow">${esc(note)}</div><h1>${esc(r.name)}</h1><p>${esc(r.subtitle)}</p></div></section><div class="client-tools"><label class="search">${icon('search')}<input name="menu-search" type="search" aria-label="Buscar no cardápio" placeholder="Buscar no cardápio" value="${esc(menuSearch)}"></label>${btn(callLabel,'call',{symbol:'bell'})}</div>${tabs([['','Tudo'],...choiceRows(categories)],activeCategory,'menu-category')}<div id="menu-results">${categoriesHtml || empty(menuSearch?'Nenhum produto encontrado.':'O cardápio ainda está sendo preparado.')}</div><footer class="clientfooter"><span>Cardápio de demonstração · Dados fictícios</span><a href="#${roles[role].start}">Voltar à operação do eMenu</a></footer></main></div>`;
}

function quantityControls(qty, action, id) {
  return `<div class="qty">${btn('Diminuir quantidade',action,{id,value:-1,symbol:'minus',hide:true,className:'icon-button'})}<span class="num" aria-live="polite">${qty}</span>${btn('Aumentar quantidade',action,{id,value:1,symbol:'plus',hide:true,className:'icon-button',disabled:qty>=99})}</div>`;
}

function showProduct(r,id) {
  const p = byId(r.products,id);
  if (!p?.active) return;
  let quantity = 1;
  openModal(p.name,`${photo(p.image,'product-photo','eager')}<p class="subtle">${esc(p.description)}</p><div class="spread"><strong>${money(p.price)}</strong>${quantityControls(quantity,'product-qty')}</div>${field('Observação',textarea('note'))}<div class="spread"><small>Subtotal</small><strong data-product-total>${money(p.price)}</strong></div>`,btn('Ver carrinho','cart',{symbol:'cart'})+submit('Adicionar ao carrinho'),data=>{
    const key = route.check || '_guest';
    const cart = cartFor(r,route.check);
    const note = String(data.get('note')||'').trim();
    const existing = cart.find(line=>line.product===p.id && line.note===note);
    if (existing && existing.quantity+quantity>99) return modalError('O limite é de 99 unidades por item.');
    if (existing) existing.quantity+=quantity;
    else cart.push({id:uid(),product:p.id,name:p.name,price:p.price,quantity,note});
    r.carts[key]=cart;
    complete(`${p.name} adicionado ao carrinho.`);
  });
  currentModal.adjust = delta=>{
    quantity = Math.max(1,Math.min(99,quantity+delta));
    dialog.querySelector('.num').textContent = quantity;
    dialog.querySelector('[data-product-total]').textContent = money(p.price*quantity);
    dialog.querySelector('[data-action="product-qty"][data-value="1"]').disabled = quantity>=99;
    dialog.querySelector('[data-action="product-qty"][data-value="-1"]').disabled = quantity<=1;
  };
  dialog.querySelector('[data-action="product-qty"][data-value="-1"]').disabled = true;
}

function showCart(r) {
  const cart = cartFor(r,route.check);
  const check = openCheck(r,route.check);
  const cartRows = cart.map(line=>`<article class="cartrow"><div class="grow"><strong>${esc(line.name)}</strong><br><small>${money(line.price)} por unidade${line.note?` · ${esc(line.note)}`:''}</small></div>${quantityControls(line.quantity,'cart-qty',line.id)}<strong class="nowrap">${money(line.price*line.quantity)}</strong></article>`).join('');
  const checkLink = check ? `<p class="subtle">${esc(tableName(r,check.table))} · Comanda ${esc(check.code)}</p>` : `<div class="helpbox">${route.check?'Esta comanda está encerrada ou indisponível.':'Vincule uma comanda aberta para enviar o pedido.'}</div>`;
  openModal('Carrinho',`${checkLink}${cart.length?`<div class="cartrows">${cartRows}</div><div class="summary"><div class="spread total"><span>Total do carrinho</span><strong>${money(totalLines(cart))}</strong></div></div>`:empty('Seu carrinho está vazio.')}`,btn('Continuar escolhendo','dismiss')+(check ? btn('Enviar pedido','send-order',{className:'primary',disabled:!cart.length}) : btn('Informar comanda','client-check',{className:'primary'})));
}

function changeCart(r,id,delta) {
  const cart = cartFor(r,route.check);
  const line = byId(cart,id);
  if (!line) return;
  if (line.quantity===1 && delta<0) {
    openModal('Remover item',`<p class="subtle">Deseja retirar ${esc(line.name)} do carrinho?</p>`,btn('Manter item','cart')+submit('Remover','danger'),()=>{
      r.carts[route.check || '_guest']=cart.filter(item=>item.id!==id);
      persist('Item removido.');
      showCart(r);
    });
    return;
  }
  line.quantity=Math.min(99,Math.max(1,line.quantity+delta));
  persist();
  showCart(r);
  const controls = [...dialog.querySelectorAll('[data-action="cart-qty"]')];
  (controls.find(b=>b.dataset.id===id && Number(b.dataset.value)===delta && !b.disabled) || controls.find(b=>b.dataset.id===id && !b.disabled))?.focus();
}

function showClientCheck(r) {
  const c = r.checks.find(item=>item.code===route.check) || r.checks.find(item=>item.code===clientCode);
  const authorized = c && (c.status==='open' || r.historyAccess[c.code]);
  const totals = authorized ? checkTotals(r,c.id) : null;
  const summary = totals ? `<div class="summary"><div class="spread"><strong>${esc(tableName(r,c.table))} · ${esc(c.code)}</strong>${tag(c.status)}</div>${totals.orders.map(o=>`<div class="spread"><span>Pedido #${o.number}</span>${tag(o.status)}</div>`).join('')}<div class="spread total"><span>${c.status==='ended'?'Total pago':'Total confirmado'}</span><strong>${money(c.status==='ended'?c.paid:totals.total)}</strong></div></div>` : '';
  openModal('Minha comanda',`${summary}${field('Código da comanda',input('code',route.check || '', 'required inputmode="numeric" maxlength="8" autocomplete="off"'))}`,cancel()+submit('Consultar comanda'),data=>{
    const code=String(data.get('code')).trim();
    const target=openCheck(r,code);
    if (!target) return modalError('Comanda aberta não localizada. Confirme o código com o garçom.');
    const oldCode=route.check || '_guest';
    if (oldCode==='_guest' && cartFor(r,null).length) {
      const destination=cartFor(r,code);
      for (const line of cartFor(r,null)) {
        const existing=destination.find(item=>item.product===line.product && item.note===line.note);
        if (existing && existing.quantity+line.quantity<=99) existing.quantity+=line.quantity;
        else destination.push(line);
      }
      r.carts[code]=destination;
      delete r.carts._guest;
    }
    clientCode=code;
    r.historyAccess[code]=true;
    writeState(state);
    dialog.close();
    navigate(clientHref(r,code));
    notify('Comanda vinculada.');
  });
}

function sendOrder(r) {
  const c=openCheck(r,route.check);
  const cart=cartFor(r,route.check);
  if (!c || !cart.length) return modalError('É necessário ter itens e uma comanda aberta.');
  const groups = new Map();
  for (const line of cart) {
    const p=byId(r.products,line.product);
    const category=p && categoryOf(r,p);
    if (!p?.active || !byId(r.sectors,category?.sector)) return modalError(`${line.name} está indisponível. Remova o item e tente novamente.`);
    const items=groups.get(category.sector) || [];
    items.push({...line, name:p.name,price:p.price});
    groups.set(category.sector,items);
  }
  for (const [sector,items] of groups) {
    const number=r.nextOrder++;
    const order={id:uid(),number,check:c.id,sector,status:'new',created:now(),delivered:null,items};
    r.orders.push(order);
  }
  r.historyAccess[c.code]=true;
  delete r.carts[c.code];
  complete('Pedido enviado aos setores responsáveis.');
}

function callWaiter(r) {
  const c=openCheck(r,route.check);
  if (!c) { showClientCheck(r); return; }
  if (r.calls.some(call=>call.check===c.id && call.status==='open')) { notify('O garçom já foi chamado para esta mesa.'); return; }
  const text=r.callFee ? `Enviar chamado para ${tableName(r,c.table)}? O valor de ${money(r.callFee)} será registrado após o atendimento.` : `Enviar chamado para ${tableName(r,c.table)}?`;
  confirmAction('Chamar garçom',text,'Enviar chamado',()=>{
    if (!openCheck(r,c.code)) return modalError('A comanda está encerrada.');
    r.calls.push({id:uid(),table:c.table,check:c.id,status:'open',created:now(),fee:r.callFee});
    complete('Garçom chamado.');
  },'primary');
}

function showTable(r,t) {
  const c=r.checks.find(c=>c.table===t.id && c.status==='open');
  const reservations=r.reservations.filter(res=>res.table===t.id && ['confirmed','arrived'].includes(currentReservation(res)));
  const details=`<div class="spread">${tag(tableStatus(r,t))}<strong>${t.seats} lugares</strong></div>${c && managesChecks() ? `<div class="summary"><strong>${esc(c.name)}</strong><p class="small">Código ${esc(c.code)} · ${money(checkTotals(r,c.id).total)} confirmado</p></div>`:''}${reservations.map(res=>`<div class="spread"><span>${esc(res.name)} · ${dateLabel(res.date)} ${esc(res.start)}</span>${btn('Ver reserva','reservation-detail',{id:res.id,className:'tiny'})}</div>`).join('')}`;
  let actions='';
  if (c && managesChecks()) actions=btn('QR Code','qr',{id:c.id,symbol:'qr'})+link('Ver comanda',`#comanda?id=${encodeURIComponent(c.id)}`,'tabs','primary');
  if (!c && !t.archived && managesChecks()) actions=btn('Abrir comanda','check-form',{id:t.id,symbol:'plus',className:'primary'});
  if (!t.archived && canReserve()) actions+=btn('Agendar reserva','reservation-form',{value:t.id,symbol:'reservations'});
  if (isManager()) actions+=btn(t.archived?'Reativar mesa':'Arquivar mesa','archive-table',{id:t.id,className:t.archived?'':'danger'});
  openModal(t.name,details,actions);
}

function tableForm(r,id) {
  if (!isManager()) return;
  const table=byId(r.tables,id);
  const fields=field('Nome da mesa',input('name',table?.name,'required maxlength="45"'))+field('Lugares',input('seats',table?.seats || 4,'type="number" min="1" max="99" required'));
  showForm(table?'Editar mesa':'Nova mesa',fields,data=>{
    const name=String(data.get('name')).trim();
    if (!name) return modalError('Informe o nome da mesa.');
    if (r.tables.some(t=>t!==table && normalize(t.name)===normalize(name))) return modalError('Já existe uma mesa com este nome.');
    const seats=Number(data.get('seats'));
    if (table && r.reservations.some(res=>res.table===table.id && ['confirmed','arrived'].includes(currentReservation(res)) && res.party>seats)) return modalError('Há uma reserva ativa que precisa de mais lugares.');
    if (table) Object.assign(table,{name,seats});
    else r.tables.push({id:uid(),name,seats,archived:false});
    complete(table?'Mesa atualizada.':'Mesa cadastrada.');
  });
}

function archiveTable(r,t) {
  if (!isManager()) return;
  if (!t.archived && tableStatus(r,t)!=='available') { notify('Encerre a comanda e as reservas ativas antes de arquivar.'); return; }
  if (t.archived) { t.archived=false; complete('Mesa reativada.'); return; }
  confirmAction('Arquivar mesa',`${t.name} sairá da lista de mesas disponíveis. O histórico será preservado.`,'Arquivar',()=>{t.archived=true;complete('Mesa arquivada.');});
}

function reservationForm(r,tableId) {
  if (!canReserve()) return;
  const tables=r.tables.filter(t=>!t.archived);
  if (!tables.length) { notify('Cadastre uma mesa ativa para fazer uma reserva.'); return; }
  const fields=field('Nome do cliente',input('name','','required maxlength="70"'),'full')+field('Mesa',select('table',placeholderOption('Selecione a mesa',tables),tableId,'required'))+field('Pessoas',input('party',2,'required type="number" min="1" max="99"'))+field('Data',input('date',day(),`required type="date" min="${day()}"`))+field('Telefone',input('contact','','type="tel" maxlength="22"'))+field('Horário de chegada',input('start','','required type="time"'))+field('Horário de saída',input('end','','required type="time"'))+field('Observações',textarea('note'),'full');
  showForm('Agendar reserva',fields,data=>{
    const res=Object.fromEntries(data);
    res.name=res.name.trim();
    res.party=Number(res.party);
    const table=byId(tables,res.table);
    if (!res.name || !table) return modalError('Informe o nome do cliente e selecione uma mesa.');
    if (res.party>table.seats) return modalError(`${table.name} tem ${table.seats} lugares.`);
    if (res.end<=res.start || res.date<day() || res.date===day() && res.end<=clock()) return modalError('Escolha um horário de saída posterior à chegada e ainda disponível.');
    const overlaps=r.reservations.some(item=>item.table===table.id && item.date===res.date && ['confirmed','arrived'].includes(currentReservation(item)) && item.start<res.end && res.start<item.end);
    if (overlaps) return modalError('A mesa já tem uma reserva que coincide com esse horário.');
    r.reservations.push({...res,id:uid(),status:'confirmed'});
    reservationView='active';
    complete('Reserva agendada.');
  },'Confirmar reserva');
}

function showReservation(r,res) {
  const status=currentReservation(res);
  const body=`<div class="spread"><strong>${esc(tableName(r,res.table))}</strong>${tag(status)}</div><div class="summary"><p>${dateLabel(res.date)} · ${esc(res.start)}–${esc(res.end)}</p><p>${res.party} ${res.party===1?'pessoa':'pessoas'}</p>${res.contact?`<p>${esc(res.contact)}</p>`:''}${res.note?`<p>${esc(res.note)}</p>`:''}</div>`;
  const actions=canReserve() ? (status==='confirmed'?btn('Confirmar chegada','reservation-status',{id:res.id,value:'arrived',className:'primary'})+btn('Cancelar reserva','reservation-status',{id:res.id,value:'cancelled',className:'danger'}):status==='arrived'?btn('Finalizar reserva','reservation-status',{id:res.id,value:'finished'}):'') : '';
  openModal(res.name,body,actions);
}

function changeReservation(r,res,next) {
  if (!canReserve()) return;
  const status=currentReservation(res);
  if (status==='confirmed' && next==='arrived') {
    if (res.date!==day()) { modalError('A chegada só pode ser registrada no dia da reserva.'); return; }
    if (r.checks.some(c=>c.table===res.table && c.status==='open')) { modalError('Encerre a comanda em uso antes de confirmar a chegada.'); return; }
    res.status=next;
    complete('Chegada confirmada.');
  }
  if (status==='confirmed' && next==='cancelled') confirmAction('Cancelar reserva',`Cancelar a reserva de ${res.name} em ${tableName(r,res.table)}?`,'Cancelar reserva',()=>{res.status=next;complete('Reserva cancelada.');});
  if (status==='arrived' && next==='finished') { res.status=next;complete('Reserva finalizada.'); }
}

function checkForm(r,tableId) {
  if (!managesChecks()) return;
  const tables=r.tables.filter(t=>!t.archived && !r.checks.some(c=>c.table===t.id && c.status==='open'));
  if (!tables.length) { notify('Nenhuma mesa está disponível para abrir uma comanda.'); return; }
  const staff=r.staff.filter(s=>s.role==='waiter' && s.active);
  const fields=field('Mesa',select('table',placeholderOption('Selecione a mesa',tables),tableId,'required'))+field('Garçom',select('staff',placeholderOption('Sem atribuição',staff),staff[0]?.id))+field('Nome da comanda',input('name','','maxlength="60" placeholder="Ex.: Comanda da Mesa 03"'),'full');
  showForm('Abrir comanda',fields,data=>{
    const table=byId(tables,data.get('table'));
    if (!table || r.checks.some(c=>c.table===table.id && c.status==='open')) return modalError('Selecione uma mesa sem comanda aberta.');
    const c={id:uid(),code:String(r.nextCheck++),table:table.id,name:String(data.get('name')).trim()||`Comanda da ${table.name}`,staff:String(data.get('staff')),status:'open',opened:now()};
    r.checks.push(c);
    complete('Comanda aberta.');
    navigate(`#comanda?id=${encodeURIComponent(c.id)}`);
  },'Abrir comanda');
}

function payCheck(r,c) {
  if (!managesChecks() || c.status!=='open') return;
  const totals=checkTotals(r,c.id);
  const pending=totals.orders.some(o=>statesInProgress.includes(o.status)) || r.calls.some(call=>call.check===c.id && call.status==='open');
  if (pending) { notify('Há pedidos ou chamados pendentes nesta comanda.'); return; }
  const paymentOptions=totals.total?[['Pix','Pix'],['Cartão','Cartão'],['Dinheiro','Dinheiro']]:[['Sem cobrança','Sem cobrança']];
  const body=`<div class="summary"><div class="spread total"><span>Valor a registrar</span><strong>${money(totals.total)}</strong></div></div>${field('Forma de pagamento',select('method',paymentOptions))}<p class="small">O pagamento é simulado. Ao confirmar, o código deixa de aceitar novos pedidos.</p>`;
  openModal('Realizar pagamento',body,cancel()+submit('Registrar e encerrar'),data=>{
    if (c.status!=='open' || checkTotals(r,c.id).orders.some(o=>statesInProgress.includes(o.status)) || r.calls.some(call=>call.check===c.id && call.status==='open')) return modalError('A comanda mudou. Abra novamente para conferir a situação.');
    Object.assign(c,{status:'ended',paid:checkTotals(r,c.id).total,method:data.get('method'),closed:now()});
    delete r.carts[c.code];
    complete('Pagamento registrado. Comanda encerrada.');
  });
}

let catalogDraft = null;
let selectedCatalogCategory = '';

function catalogOrder(r) {
  const draft = catalogDraft?.restaurant === r.id ? catalogDraft : null;
  const ordered = (items, ids) => {
    const byKey = new Map(items.map(item => [item.id, item]));
    return [...(ids || []).filter(id => byKey.has(id)).map(id => byKey.get(id)), ...items.filter(item => !ids?.includes(item.id))];
  };
  return {categories: ordered(r.categories, draft?.categories), products: ordered(r.products, draft?.products)};
}

function playlistHandle(id, name, kind) {
  return `<button type="button" class="playlist-handle" data-playlist-handle="${esc(id)}" data-kind="${kind}" aria-label="Arrastar ${esc(name)}" aria-describedby="playlist-help"><span aria-hidden="true">⠿</span></button>`;
}

function categoryPlaylist(r, categories, selected) {
  const rows = categories.map((category, index) => {
    const count = r.products.filter(product => product.category === category.id).length;
    return `<li class="playlist-row category-playlist-row${selected === category.id ? ' selected' : ''}" data-playlist-id="${esc(category.id)}">${playlistHandle(category.id, category.name, 'categories')}<span class="playlist-position">${index + 1}</span><button type="button" class="category-choice" data-action="catalog-category" data-id="${esc(category.id)}"${selected === category.id ? ' aria-pressed="true"' : ''}><strong>${esc(category.name)}</strong><small>${esc(sectorName(r, category.sector))} · ${count} ${count === 1 ? 'produto' : 'produtos'}</small></button><div class="playlist-actions">${btn('Editar','category-form',{id:category.id,className:'tiny'})}${btn('Ações da categoria','entity-menu',{id:category.id,value:'category',symbol:'more',hide:true,className:'tiny'})}</div></li>`;
  }).join('');
  return `<ul class="playlist-list" data-playlist-kind="categories" aria-label="Categorias em ordem">${rows}</ul>${!rows ? `<div class="panel-body">${empty('Crie uma categoria antes de adicionar produtos.')}</div>` : ''}`;
}

function rememberCatalogOrder(r, kind, category, ids) {
  const current = catalogOrder(r);
  const draft = {restaurant:r.id,categories:current.categories.map(item=>item.id),products:current.products.map(item=>item.id)};
  if (kind === 'categories') draft.categories = ids;
  else {
    let index = 0;
    draft.products = current.products.map(product => product.category===category ? ids[index++] : product.id);
  }
  catalogDraft = draft;
}

function bindCatalogPlaylists(r) {
  for (const list of app.querySelectorAll('[data-playlist-kind]')) {
    let dragging = null;
    let frame = 0;
    const kind = list.dataset.playlistKind;
    const remember = () => rememberCatalogOrder(r,kind,list.dataset.category,[...list.children].map(row=>row.dataset.playlistId));
    const restoreFocus = id => [...app.querySelectorAll('[data-playlist-handle]')].find(handle=>handle.dataset.playlistHandle===id && handle.dataset.kind===kind)?.focus({preventScroll:true});
    const numberRows = () => [...list.children].forEach((item,index)=>{
      item.querySelector('.playlist-position').textContent = index + 1;
      if (item.classList.contains('playlist-drop-slot')) item.dataset.dropPosition = `Soltar aqui · posição ${index + 1}`;
    });
    const stop = (cancelled = false) => {
      cancelAnimationFrame(frame);
      if (!dragging) return;
      const {row, pointerId, original, preview} = dragging;
      dragging = null;
      preview.remove();
      row.classList.remove('playlist-drop-slot');
      delete row.dataset.dropPosition;
      list.classList.remove('playlist-drag-active');
      document.removeEventListener('keydown',cancelWithEscape);
      if (cancelled) {
        const rows = new Map([...list.children].map(item=>[item.dataset.playlistId,item]));
        original.forEach(id=>list.append(rows.get(id)));
      }
      numberRows();
      if (list.hasPointerCapture(pointerId)) list.releasePointerCapture(pointerId);
      if (!list.isConnected) return;
      const ids = [...list.children].map(item=>item.dataset.playlistId);
      if (ids.some((id,index)=>id!==original[index])) {
        const scrollTop = list.scrollTop;
        remember();
        render();
        const updatedList = app.querySelector(`[data-playlist-kind="${kind}"]`);
        updatedList.scrollTop = scrollTop;
        restoreFocus(row.dataset.playlistId);
        notify('Posição alterada. Clique em Salvar ordem para confirmar.');
      } else restoreFocus(row.dataset.playlistId);
    };
    const cancelWithEscape = event => {
      if (event.key !== 'Escape' || !dragging) return;
      event.preventDefault();
      stop(true);
    };
    const moveSlot = (row,next) => {
      if (row.nextElementSibling === next) return;
      const positions = new Map([...list.children].map(item=>[item,item.getBoundingClientRect().top]));
      list.insertBefore(row,next);
      for (const item of list.children) {
        item.getAnimations().forEach(animation=>animation.cancel());
        const delta = positions.get(item) - item.getBoundingClientRect().top;
        if (item !== row && delta && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          item.animate([{transform:`translateY(${delta}px)`},{transform:'translateY(0)'}],{duration:180,easing:'ease-out'});
        }
      }
      numberRows();
    };
    const move = () => {
      if (!dragging || !list.isConnected) { stop(true); return; }
      const {x,y,row,preview,offsetX,offsetY} = dragging;
      preview.style.transform = `translate3d(${x-offsetX}px,${y-offsetY}px,0)`;
      const box = list.getBoundingClientRect();
      if (x >= box.left - 24 && x <= box.right + 24) {
        const speed = y<box.top+38 ? -15 : y>box.bottom-38 ? 15 : 0;
        if (speed) list.scrollTop += speed;
        const candidates = [...list.children].filter(item=>item!==row);
        const next = candidates.find(item=>{
          const bounds = item.getBoundingClientRect();
          return y < bounds.top + bounds.height / 2;
        }) || null;
        moveSlot(row,next);
      }
      frame = requestAnimationFrame(move);
    };
    list.addEventListener('pointerdown',event=>{
      const handle = event.target.closest('[data-playlist-handle]');
      if (!handle || event.button!==0) return;
      event.preventDefault();
      handle.focus({preventScroll:true});
      list.setPointerCapture(event.pointerId);
      const row = handle.closest('[data-playlist-id]');
      const bounds = row.getBoundingClientRect();
      const preview = row.cloneNode(true);
      preview.classList.add('playlist-drag-preview');
      preview.removeAttribute('data-playlist-id');
      preview.setAttribute('aria-hidden','true');
      preview.inert = true;
      preview.style.width = `${bounds.width}px`;
      preview.style.height = `${bounds.height}px`;
      preview.style.transform = `translate3d(${bounds.left}px,${bounds.top}px,0)`;
      document.body.append(preview);
      dragging = {row,preview,pointerId:event.pointerId,x:event.clientX,y:event.clientY,offsetX:event.clientX-bounds.left,offsetY:event.clientY-bounds.top,original:[...list.children].map(item=>item.dataset.playlistId)};
      row.classList.add('playlist-drop-slot');
      list.classList.add('playlist-drag-active');
      numberRows();
      document.addEventListener('keydown',cancelWithEscape);
      frame = requestAnimationFrame(move);
    });
    list.addEventListener('pointermove',event=>{
      if (dragging && dragging.pointerId===event.pointerId) Object.assign(dragging,{x:event.clientX,y:event.clientY});
    });
    list.addEventListener('pointerup',()=>stop(false));
    list.addEventListener('pointercancel',()=>stop(true));
    list.addEventListener('lostpointercapture',()=>stop(true));
    list.addEventListener('keydown',event=>{
      const row = event.target.closest('[data-playlist-id]');
      if (!event.target.matches('[data-playlist-handle]') || !event.altKey || !['ArrowUp','ArrowDown'].includes(event.key)) return;
      event.preventDefault();
      const neighbor = event.key==='ArrowUp'?row.previousElementSibling:row.nextElementSibling;
      if (!neighbor) return;
      list.insertBefore(row,event.key==='ArrowUp'?neighbor:neighbor.nextSibling);
      remember();
      const scrollTop = list.scrollTop;
      render();
      const updatedList = app.querySelector(`[data-playlist-kind="${kind}"]`);
      updatedList.scrollTop = scrollTop;
      restoreFocus(row.dataset.playlistId);
    });
  }
}

function saveCatalogOrder(r) {
  if (!isManager() || catalogDraft?.restaurant!==r.id) return;
  const ordered = catalogOrder(r);
  const updated = {...r,categories:ordered.categories,products:ordered.products};
  const next = {...state,restaurants:state.restaurants.map(item=>item===r?updated:item)};
  if (!writeState(next)) { notify('Não foi possível salvar. Tente novamente.'); return; }
  Object.assign(r,updated);
  catalogDraft = null;
  render();
  notify('Ordem das categorias e dos produtos salva.');
}

function categoryForm(r,id) {
  if (!r.sectors.length) { notify('Cadastre um setor antes de criar uma categoria.'); return; }
  const c=byId(r.categories,id);
  const fields=field('Nome',input('name',c?.name,'required maxlength="55"'))+field('Setor responsável',select('sector',choiceRows(r.sectors),c?.sector,'required'));
  showForm(c?'Editar categoria':'Nova categoria',fields,data=>{
    const name=String(data.get('name')).trim();
    const sector=String(data.get('sector'));
    if (!name || !byId(r.sectors,sector)) return modalError('Informe o nome e o setor responsável.');
    if (r.categories.some(item=>item!==c && normalize(item.name)===normalize(name))) return modalError('Já existe uma categoria com este nome.');
    if (c) Object.assign(c,{name,sector});
    else r.categories.push({id:uid(),name,sector});
    complete(c?'Categoria atualizada.':'Categoria cadastrada.');
  });
}

function removeCategory(r,c) {
  const products=r.products.filter(p=>p.category===c.id);
  const alternatives=r.categories.filter(item=>item.id!==c.id);
  if (products.length && !alternatives.length) { openModal('Categoria em uso','<p class="subtle">Crie outra categoria para transferir os produtos antes de excluir esta.</p>',btn('Entendi','dismiss')); return; }
  const body=`<p class="subtle">${esc(c.name)} será retirada do cardápio.${products.length?' Escolha o destino dos produtos.':''}</p>${products.length?field('Mover produtos para',select('category',placeholderOption('Selecione a categoria',alternatives),'','required')):''}`;
  openModal('Excluir categoria',body,cancel()+submit('Excluir categoria','danger'),data=>{
    const target=byId(alternatives,data.get('category'));
    if (products.length && !target) return modalError('Escolha uma categoria de destino.');
    products.forEach(p=>p.category=target.id);
    r.categories=r.categories.filter(item=>item!==c);
    complete('Categoria excluída.');
  });
}

  if (!r.categories.length) { notify('Cadastre uma categoria antes de criar um produto.'); return; }
  const p=byId(r.products,id);
  const fields=field('Nome',input('name',p?.name,'required maxlength="70"'),'full')+field('Categoria',select('category',choiceRows(r.categories),p?.category,'required'))+field('Preço (R$)',input('price',p?(p.price/100).toFixed(2).replace('.',','):'','required inputmode="decimal" maxlength="10" placeholder="6,50"'))+field('Descrição',textarea('description',p?.description),'full')+field('URL da imagem',input('image',p?.image,'type="url" placeholder="https://" maxlength="650"'),'full')+`<label class="check full"><input type="checkbox" name="active" ${p?.active===false?'':'checked'}> Visível no cardápio</label>`;
  showForm(p?'Editar produto':'Novo produto',fields,data=>{
    const name=String(data.get('name')).trim();
    const price=parsePrice(data.get('price'));
    const category=String(data.get('category'));
    const image=String(data.get('image')).trim();
    if (!name || price===null || !byId(r.categories,category)) return modalError('Informe nome, categoria e preço válido. Exemplo de preço: 6,50.');
    if (image && !safeImage(image)) return modalError('Use uma URL HTTPS para a imagem.');
    const fields={name,price,category,description:String(data.get('description')).trim(),image,active:data.has('active')};
    if (p) Object.assign(p,fields);
    else r.products.push({id:uid(),...fields});
    complete(p?'Produto atualizado.':'Produto cadastrado.');
  });
}

function parsePrice(value) {
  const match=String(value??'').trim().match(/^(\d{1,6})(?:[.,](\d{1,2}))?$/);
  return match?Number(match[1])*100+Number((match[2]||'').padEnd(2,'0')):null;
}
