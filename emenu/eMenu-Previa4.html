function reportData(r,start=reportStart,end=reportEnd) {
  const inside=date=>date && day(new Date(date))>=start && day(new Date(date))<=end;
  const orders=r.orders.filter(o=>o.status==='delivered' && inside(o.delivered || o.created));
  const checks=r.checks.filter(c=>c.status==='ended' && inside(c.closed));
  const ranking=new Map();
  for (const o of orders) for (const item of o.items) {
    const current=ranking.get(item.product) || {name:item.name,qty:0,total:0};
    current.qty+=item.quantity;
    current.total+=item.price*item.quantity;
    ranking.set(item.product,current);
  }
  return {orders,checks,ranking:[...ranking.values()].sort((a,b)=>b.qty-a.qty || b.total-a.total || a.name.localeCompare(b.name,'pt-BR')),revenue:checks.reduce((total,c)=>total+c.paid,0)};
}

function renderReports(r) {
  const data=reportData(r);
  const reportRows=reportView==='ranking'?data.ranking.map((item,index)=>`<div class="list-row"><div><h3>${index+1}. ${esc(item.name)}</h3><p class="small">${item.qty} ${item.qty===1?'unidade entregue':'unidades entregues'}</p></div><strong>${money(item.total)}</strong></div>`).join(''):data.checks.map(c=>`<div class="list-row"><div><h3>${esc(c.name)}</h3><p class="small">${dateLabel(day(new Date(c.closed)))} · ${timeLabel(c.closed)} · ${esc(c.method)}</p></div><strong>${money(c.paid)}</strong></div>`).join('');
  return pageHead('Relatórios','Consulte os recebimentos e os produtos mais vendidos no período selecionado.',btn('Exportar CSV','export-report',{disabled:reportView==='ranking'?!data.ranking.length:!data.checks.length}))+
    `<form id="report-filter" class="panel panel-body report-filter">${field('De',input('start',reportStart,'type="date" required'))}${field('Até',input('end',reportEnd,'type="date" required'))}${submit('Aplicar período')}${btn('Hoje','report-today')}${btn('Últimos 7 dias','report-week')}<p class="error full" role="alert" hidden></p></form><div class="stack"><section class="metrics report-metrics" aria-label="Resumo do período">${metric('Recebido',money(data.revenue),'Comandas pagas','reports')}${metric('Comandas pagas',data.checks.length,'Registros no período','tabs')}${metric('Pedidos entregues',data.orders.length,'Entregas confirmadas','orders')}${metric('Itens entregues',data.ranking.reduce((n,item)=>n+item.qty,0),'Unidades registradas','catalog')}</section></div>`+tabs([['day','Relatório do dia'],['ranking','Mais vendidos']],reportView,'report-view')+panel(reportView==='ranking'?'Produtos mais vendidos':'Comandas pagas',reportRows||`<div class="panel-body">${empty('Nenhum resultado para este período.')}</div>`,`${dateLabel(reportStart)} a ${dateLabel(reportEnd)}`);
}

function exportReport(r) {
  const data=reportData(r);
  const rows=reportView==='ranking'?[['Produto','Quantidade','Valor'],...data.ranking.map(item=>[item.name,item.qty,money(item.total)])]:[['Comanda','Data','Forma de pagamento','Valor'],...data.checks.map(c=>[c.name,dateLabel(day(new Date(c.closed))),c.method,money(c.paid)])];
  const csvCell=value=>{
    const raw=String(value??'');
    const safe=/^[\s]*[=+@-]/.test(raw)?`'${raw}`:raw;
    return `"${safe.replaceAll('"','""')}"`;
  };
  const file=new Blob(['\ufeff'+rows.map(row=>row.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(file);
  const a=document.createElement('a');
  a.href=url;
  a.download=`emenu-${reportView}-${reportStart}-${reportEnd}.csv`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function renderSettings(r) {
  const rows=r.screens.map(s=>`<div class="list-row"><div><h3>${esc(s.name)}</h3><p class="small">${s.id===r.queueScreen?'Tela da fila geral':esc(r.sectors.filter(x=>x.screen===s.id).map(x=>x.name).join(', ') || 'Sem setor vinculado')}</p></div>${btn('Editar tela','screen-form',{id:s.id,className:'tiny'})}</div>`).join('');
  const body=`<div class="list-row"><div class="list-title"><span class="mark">${r.logo?photo(r.logo):icon('catalog')}</span><div><h3>${esc(r.name)}</h3><p class="small">${esc(r.subtitle)}</p></div></div>${btn('Ações do estabelecimento','restaurant-menu',{symbol:'more',hide:true,className:'tiny'})}</div><div class="list-row"><div><h3>Identidade do cardápio</h3><p class="small">Logo, cor principal e fundo</p></div>${btn('Personalizar','restaurant-form',{className:'tiny'})}</div><div class="list-row"><div><h3>Chamar garçom</h3><p class="small">${r.callFee?money(r.callFee)+' por chamado atendido':'Sem cobrança'}</p></div>${btn('Configurar','call-fee',{className:'tiny'})}</div>`;
  return pageHead('Estabelecimento','Gerencie o cardápio do cliente e o destino dos pedidos.',btn('Novo estabelecimento','restaurant-form',{value:'new',symbol:'plus',className:'primary'}))+`<div class="stack"><div class="row"><label class="row">Estabelecimento ${select('restaurant',choiceRows(state.restaurants),r.id)}</label>${link('Prévia do cardápio',clientHref(r,r.checks.find(c=>c.status==='open')?.code),'eye')}</div>${panel('Configurações',body)}${panel('Telas de pedidos',rows+`<div class="list-row"><label class="row">Tela da fila geral ${select('queue-screen',choiceRows(r.screens),r.queueScreen)}</label>${btn('Nova tela','screen-form',{symbol:'plus'})}</div>`)}</div>`;
}

function restaurantForm(r,creating) {
  const current=creating?makeRestaurant('', ''):r;
  const existingLogo=current.logo && !current.logo.startsWith('data:')?current.logo:'';
  const fields=field('Nome do estabelecimento',input('name',current.name,'required maxlength="70"'),'full')+field('Descrição do cardápio',textarea('subtitle',current.subtitle),'full')+field('Cor principal',input('accent',allowedColor(current.accent,menuPalette.accent),'type="color" class="swatch"'))+field('Fundo do cardápio',input('background',allowedColor(current.background,menuPalette.background),'type="color" class="swatch"'))+field('URL HTTPS da logo',input('logo',existingLogo,'type="url" placeholder="https://" maxlength="650"'),'full')+field('Ou enviar imagem (até 400 KB)','<input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif">','full')+(current.logo?'<label class="check full"><input type="checkbox" name="remove-logo"> Remover a logo atual</label>':'');
  showForm(creating?'Novo estabelecimento':'Personalizar estabelecimento',fields,data=>{
    const name=String(data.get('name')).trim();
    const source=String(data.get('logo')).trim();
    const image=data.get('image');
    if (!name || state.restaurants.some(x=>x!==current && normalize(x.name)===normalize(name))) return modalError('Informe um nome de estabelecimento que ainda não esteja em uso.');
    if (source && !safeImage(source)) return modalError('Informe uma URL HTTPS válida.');
    const save=logo=>{
      const branding={name,subtitle:String(data.get('subtitle')).trim(),accent:data.get('accent'),background:data.get('background'),logo};
      if (creating) { const created={...makeRestaurant(uid(),name),...branding}; state.restaurants.push(created); state.active=created.id; }
      else Object.assign(r,branding);
      complete(creating?'Estabelecimento cadastrado.':'Estabelecimento atualizado.');
    };
    if (image?.size) {
      if (image.size>400*1024 || !/^image\/(png|jpeg|webp|gif)$/.test(image.type)) return modalError('Escolha uma imagem PNG, JPG, WebP ou GIF de até 400 KB.');
      const reader=new FileReader();
      const modal=currentModal;
      reader.addEventListener('load',()=>{if (dialog.open && currentModal===modal) save(reader.result);});
      reader.addEventListener('error',()=>{if (dialog.open && currentModal===modal) modalError('Não foi possível carregar a imagem.');});
      reader.readAsDataURL(image);
      return;
    }
    save(data.has('remove-logo')?'':source || (current.logo.startsWith('data:')?current.logo:''));
  });
}

function screenForm(r,id) {
  const screen=byId(r.screens,id);
  showForm(screen?'Editar tela':'Nova tela',field('Nome da tela',input('name',screen?.name,'required maxlength="50"'),'full'),data=>{
    const name=String(data.get('name')).trim();
    if (!name || r.screens.some(s=>s!==screen && normalize(s.name)===normalize(name))) return modalError('Informe um nome de tela que ainda não esteja em uso.');
    if (screen) screen.name=name;
    else r.screens.push({id:uid(),name});
    complete(screen?'Tela atualizada.':'Tela cadastrada.');
  });
}

function renderReview(r) {
  const steps=[
    ['Cardápio no celular','Abra o cardápio, escolha Limonada da casa e aumente para duas unidades. O carrinho deve exibir R$ 13,00 e pedir confirmação antes de retirar a última unidade.',clientHref(r,'2401'),'Abrir cardápio'],
    ['Da cozinha até o pagamento','Envie o pedido, mude para Cozinheiro para processar pedidos do setor Cozinha e para Garçom para confirmar a entrega. Use o perfil Gerente para transitar também pedidos do Bar. Abra a comanda e registre o pagamento depois de concluir as pendências.','#orders','Ver pedidos'],
    ['Reservas e mesas','Agende uma reserva, consulte a mesa e cancele pela própria reserva. O histórico exibe o cancelamento e libera a mesa para outro agendamento.','#reservations','Ver reservas'],
    ['Ordem e exclusão de categorias','Mova categorias e produtos. Ao excluir uma categoria em uso, escolha o destino dos produtos. A aba selecionada continua aberta.','#catalog','Ver cardápio da gestão'],
    ['Telas por setor','Associe as categorias aos setores e os setores às telas. Compare os pedidos no Painel da fila e na Lista de pedidos.','#queue','Ver fila de pedidos'],
    ['Relatórios por período','Compare o período de hoje com os últimos sete dias. O filtro é aplicado ao relatório do dia e ao ranking de produtos.','#reports','Ver relatórios']
  ];
  return pageHead('Roteiro de teste','Explore a demonstração e repita os fluxos com os dados de exemplo.',btn('Restaurar dados da demonstração','reset',{className:'danger'}))+`<div class="tiles review-grid">${steps.map(([title,description,href,label])=>`<article class="panel tile"><h2>${title}</h2><p class="subtle">${description}</p>${link(label,href,'eye')}</article>`).join('')}</div>`;
}

function advanceOrder(r,order,next) {
  const expected={new:'preparing',preparing:'ready',ready:'delivered'}[order.status];
  const permissions=isManager() || (role==='cook' && next!=='delivered') || (role==='waiter' && next==='delivered');
  if (!expected || next!==expected || !permissions || byId(r.checks,order.check)?.status!=='open') return;
  if (role==='cook') {
    const assigned=r.staff.find(s=>s.role==='cook' && s.active)?.sectors || [];
    if (assigned.length && !assigned.includes(order.sector)) return;
  }
  order.status=next;
  if (next==='delivered') order.delivered=now();
  persist(`Pedido #${order.number} · ${statusNames[next]}.`);
}

function cancelOrder(order) {
  if (!isManager() || !statesInProgress.includes(order.status)) return;
  confirmAction('Cancelar pedido',`Cancelar o pedido #${order.number}? Ele será registrado no histórico de cancelamentos.`,'Cancelar pedido',()=>{
    order.status='cancelled';
    order.cancelled=now();
    complete('Pedido cancelado.');
  });
}

function removeSector(r,sector) {
  if (r.categories.some(c=>c.sector===sector.id) || r.orders.some(o=>o.sector===sector.id)) {
    openModal('Setor em uso','<p class="subtle">O setor está vinculado a categorias ou ao histórico de pedidos. Edite o nome ou altere a tela do setor.</p>',btn('Entendi','dismiss'));
    return;
  }
  confirmAction('Excluir setor',`Excluir ${sector.name}?`,'Excluir setor',()=>{
    r.staff.forEach(member=>member.sectors=member.sectors.filter(id=>id!==sector.id));
    r.sectors=r.sectors.filter(s=>s!==sector);
    complete('Setor excluído.');
  });
}

function callFeeForm(r) {
  const active=r.callFee===1;
  showForm('Chamar garçom',field('Cobrança por chamado atendido',select('fee',[['0','Sem cobrança'],['1','R$ 0,01']],active?'1':'0'),'full')+'<p class="small full">O valor aparece antes de o cliente enviar o chamado e entra na comanda após o atendimento.</p>',data=>{
    r.callFee=Number(data.get('fee'));
    complete('Configuração do chamado atualizada.');
  });
}

const actions = {
  dismiss:()=>dialog.close(),
  'menu-category':(r,id,value)=>{menuCategory=value;render();},
  product:showProduct,
  'product-qty':(r,id,value)=>currentModal?.adjust?.(Number(value)),
  cart:showCart,
  'cart-qty':(r,id,value)=>changeCart(r,id,Number(value)),
  'client-check':showClientCheck,
  'send-order':sendOrder,
  call:callWaiter,
  'order-view':(r,id,value)=>{orderView=value;render();},
  advance:(r,id,value)=>{const o=byId(r.orders,id);if (o) advanceOrder(r,o,value);},
  'cancel-order':(r,id)=>{const o=byId(r.orders,id);if (o) cancelOrder(o);},
  'handle-call':(r,id)=>{
    const call=byId(r.calls,id);
    if (managesChecks() && call?.status==='open') {call.status='done';call.attended=now();persist('Atendimento concluído.');}
  },
  'table-detail':(r,id)=>{const table=byId(r.tables,id);if (table && role!=='cook') showTable(r,table);},
  'table-form':tableForm,
  'archive-table':(r,id)=>{const table=byId(r.tables,id);if (table) archiveTable(r,table);},
  'reservation-form':(r,id,value)=>reservationForm(r,value),
  'reservation-view':(r,id,value)=>{reservationView=value;render();},
  'reservation-detail':(r,id)=>{const res=byId(r.reservations,id);if (res && canReserve()) showReservation(r,res);},
  'reservation-status':(r,id,value)=>{const res=byId(r.reservations,id);if (res) changeReservation(r,res,value);},
  'check-form':checkForm,
  pay:(r,id)=>{const c=byId(r.checks,id);if (c) payCheck(r,c);},
  qr:(r,id)=>{const c=byId(r.checks,id);if (managesChecks() && c?.status==='open') showQr(r,c);},
  copy:async(r,id,value)=>{
    try {await navigator.clipboard.writeText(value);notify('Link copiado.');}
    catch {openModal('Link do cardápio',field('Copie o endereço',input('share-url',value,'readonly')),btn('Fechar','dismiss'));dialog.querySelector('input').select();}
  },
  'queue-view':(r,id,value)=>{queueView=value;render();},
  fullscreen:()=>{if (document.fullscreenElement) document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>notify('A tela cheia está indisponível neste navegador.'));},
  'entity-menu':(r,id,value)=>{if (isManager()) entityMenu(r,value,id);},
  'catalog-view':(r,id,value)=>{catalogView=value;render();},
  'category-form':(r,id)=>{if (isManager()) categoryForm(r,id);},
  'category-remove':(r,id)=>{const c=byId(r.categories,id);if (isManager() && c) removeCategory(r,c);},
  'product-form':(r,id)=>{if (isManager()) productForm(r,id);},
  'product-toggle':(r,id)=>{const p=byId(r.products,id);if (isManager() && p) {p.active=!p.active;complete(p.active?'Produto exibido no cardápio.':'Produto ocultado.');}},
  'catalog-category':(r,id)=>{selectedCatalogCategory=id;catalogView='products';render();},
  'catalog-order-save':saveCatalogOrder,
  'catalog-order-cancel':()=>{catalogDraft=null;render();notify('Alterações de ordem descartadas.');},
  'team-view':(r,id,value)=>{teamView=value;render();},
  'staff-form':(r,id)=>{if (isManager()) staffForm(r,id);},
  'staff-toggle':(r,id)=>{const member=byId(r.staff,id);if (isManager() && member) {member.active=!member.active;complete(member.active?'Funcionário ativado.':'Funcionário desativado.');}},
  'sector-form':(r,id)=>{if (isManager()) sectorForm(r,id);},
  'sector-remove':(r,id)=>{const sector=byId(r.sectors,id);if (isManager() && sector) removeSector(r,sector);},
  'report-view':(r,id,value)=>{reportView=value;render();},
  'report-today':()=>{reportStart=day();reportEnd=reportStart;render();},
  'report-week':()=>{reportEnd=day();reportStart=day(new Date(Date.now()-6*86400000));render();},
  'export-report':r=>{if (isManager()) exportReport(r);},
  'restaurant-menu':r=>{if (isManager()) openModal(r.name,'',btn('Editar e personalizar','restaurant-form')+link('Abrir cardápio',clientHref(r),'eye','primary'));},
  'restaurant-form':(r,id,value)=>{if (isManager()) restaurantForm(r,value==='new');},
  'screen-form':(r,id)=>{if (isManager()) screenForm(r,id);},
  'call-fee':r=>{if (isManager()) callFeeForm(r);},
  reset:()=>{
    if (!isManager()) return;
    confirmAction('Restaurar dados da demonstração','As alterações de exemplo neste navegador serão substituídas pelos dados iniciais.','Restaurar',()=>{Object.assign(state,makeSeed());complete('Dados da demonstração restaurados.');});
  }
};

document.addEventListener('click',event=>{
  const skip=event.target.closest('a.skip');
  if (skip) {event.preventDefault();document.querySelector('#conteudo')?.focus();return;}
  const button=event.target.closest('button[data-action]');
  if (!button || button.disabled) return;
  const {action,id,value}=button.dataset;
  if (Object.hasOwn(actions,action)) actions[action](restaurant(),id,value);
});

document.addEventListener('change',event=>{
  const {name,value}=event.target;
  if (name==='role' && event.target.closest('.app-header') && Object.hasOwn(roles,value)) {
    role=value;
    sessionStorage.setItem('emenu-role',role);
    if (!roles[role].tabs.includes(route.page)) navigate(`#${roles[role].start}`);
    else render();
  }
  if (name==='sector-filter') {sectorFilter=value;render();}
  if (name==='queue-sector') {queueSector=value;render();}
  if (name==='restaurant' && isManager() && byId(state.restaurants,value)) {state.active=value;persist();}
  if (name==='queue-screen' && isManager() && byId(restaurant().screens,value)) {restaurant().queueScreen=value;persist('Tela da fila geral atualizada.');}
});

document.addEventListener('input',event=>{
  if (event.target.name!=='menu-search') return;
  menuSearch=event.target.value;
  const template=document.createElement('template');
  template.innerHTML=renderClient(restaurant());
  app.querySelector('#menu-results').replaceWith(template.content.querySelector('#menu-results'));
});

document.addEventListener('submit',event=>{
  if (event.target.id!=='report-filter') return;
  event.preventDefault();
  const data=new FormData(event.target);
  if (data.get('end')<data.get('start')) {
    const error=event.target.querySelector('.error');
    error.textContent='A data final precisa ser igual ou posterior à inicial.';
    error.hidden=false;
    return;
  }
  reportStart=data.get('start');
  reportEnd=data.get('end');
  render();
});

window.addEventListener('hashchange',()=>{
  if (dialog.open) dialog.close();
  const next=routeFromHash();
  const pageChanged=next.page!==route?.page || next.id!==route?.id;
  const detailChanged=next.detail!==route?.detail;
  if (pageChanged) {menuSearch='';menuCategory='';}
  render();
  if (pageChanged || detailChanged) document.querySelector('#conteudo')?.focus({preventScroll:true});
  window.scrollTo(0,0);
});

window.addEventListener('storage',event=>{
  if (event.key!==storageKey) return;
  Object.assign(state,getState());
  catalogDraft=null;
  if (dialog.open) {dialog.close();notify('A demonstração foi atualizada em outra aba.');}
  render();
});

let displayedMinute=clock();
setInterval(()=>{
  if (clock()===displayedMinute || dialog.open || document.activeElement?.matches('input,select,textarea')) return;
  displayedMinute=clock();
  if (['overview','tables','reservations'].includes(route?.page)) render();
},15000);

if (!localStorage.getItem(storageKey)) writeState(state);
render();

</script>
</body>
</html>
