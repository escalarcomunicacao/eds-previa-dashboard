staffForm=function(r,id){
  if(!isEDS)return;
  const m=byId(r.staff,id);
  const fields=field('Nome do funcionário',input('name',m?.name,'required maxlength="65"'),'full')+field('Cargo',select('role',Object.entries(roles).map(([id,v])=>[id,v.name]),m?.role||'waiter'))+field('Login de acesso',input('login',m?.login,'required maxlength="90" autocomplete="off"'))+field(m?'Nova senha de demonstração (opcional)':'Senha de demonstração',input('password','','type="password" minlength="6" autocomplete="new-password" '+(m?'':'required'))+'<small>Use apenas uma senha fictícia nesta prévia.</small>','full')+`<fieldset class="full sector-choices"><legend>Setores vinculados</legend>${r.sectors.map(s=>`<label class="check"><input type="checkbox" name="sector" value="${esc(s.id)}" ${m?.sectors.includes(s.id)?'checked':''}>${esc(s.name)}</label>`).join('')}</fieldset><label class="check full"><input type="checkbox" name="active" ${m?.active===false?'':'checked'}>Funcionário com acesso ativo</label>`;
  showForm(m?'Editar funcionário':'Novo funcionário',fields,async data=>{
    const name=String(data.get('name')).trim(),login=String(data.get('login')).trim().toLowerCase(),selectedRole=String(data.get('role')),sectors=data.getAll('sector');
    if(!name||!login||r.staff.some(s=>s!==m&&s.login.toLowerCase()===login))return modalError('Informe nome e um login que ainda não esteja em uso.');
    if(selectedRole==='cook'&&!sectors.length)return modalError('Vincule ao menos um setor ao cozinheiro.');
    const v={name,login,role:selectedRole,sectors,active:data.has('active')};
    const pass=String(data.get('password'));
    if(pass)v.passwordHash=await hashPassword(pass);
    if(m)Object.assign(m,v);else r.staff.push({id:uid(),...v});
    complete(m?'Funcionário atualizado na demonstração.':'Funcionário cadastrado. Ele já pode entrar no portal neste navegador.');
  });
};
async function hashPassword(pass){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pass));return Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');}

// Operational actions never expose EDS configuration, including to a manager.
const cfgActions=['table-form','archive-table','entity-menu','category-form','category-remove','product-form','product-toggle','catalog-order-save','catalog-order-cancel','staff-form','staff-toggle','sector-form','sector-remove','restaurant-menu','restaurant-form','screen-form','call-fee'];
for(const key of cfgActions){const action=actions[key];actions[key]=(...args)=>isEDS?action(...args):notify('Os cadastros são configurados no EDS.');}
actions['cfg-archive']=(r,id)=>{if(isEDS){const t=byId(r.tables,id);if(t)archiveTable(r,t);}};
actions['cfg-preview']=(r,id,value)=>{cfgPreview=value;render();};
actions['logout']=()=>{sessionStorage.removeItem('emenu-preview-member');location.hash='login';render();};
actions['demo-login']=(r,id)=>{const m=byId(r.staff,id);if(m?.active)enterOperation(m,'orders');};
actions['assume-table']=(r,id)=>{
  const c=byId(r.checks,id),m=currentStaff(r);if(role==='cook'||!c||c.status!=='open'||!m)return;
  if(c.staff===m.id)return notify('Você já é o responsável por esta mesa.');
  confirmAction('Assumir atendimento',`Você ficará responsável pela ${tableName(r,c.table)}. O histórico da comanda será mantido.`,'Assumir mesa',()=>{c.staff=m.id;complete('Você assumiu o atendimento desta mesa.');},'primary');
};
actions['new-attendance-order']=(r,id)=>{
  if(role==='cook')return;
  const c=byId(r.checks,id);if(!c||c.status!=='open')return;
  const products=r.products.filter(p=>p.active&&byId(r.categories,p.category));
  if(!products.length)return notify('Nenhum produto disponível.');
  showForm('Adicionar pedido',field('Produto',select('product',products.map(p=>[p.id,`${p.name} · ${money(p.price)}`]),products[0]?.id),'full')+field('Quantidade',input('quantity',1,'type="number" min="1" max="99" required'))+field('Observação',textarea('note'),'full'),data=>{
    const p=byId(products,data.get('product')),q=Number(data.get('quantity'));if(!p||!Number.isInteger(q)||q<1||q>99)return modalError('Selecione um produto e uma quantidade válida.');
    const sector=byId(r.categories,p.category)?.sector;if(!byId(r.sectors,sector))return modalError('Este produto está sem setor de preparo.');
    r.orders.push({id:uid(),number:r.nextOrder++,check:c.id,sector,status:'new',created:now(),items:[{product:p.id,name:p.name,price:p.price,quantity:q,note:String(data.get('note')).trim()}]});
    complete('Pedido enviado ao setor de preparo.');
  },'Enviar pedido');
};

render=function(){
  route=routeFromHash();const r=restaurant();
  if(isEDS){
    const key=location.hash.slice(1).split('?')[0],page=Object.hasOwn(configPages,key)?key:'overview';
    const views={overview:cfgOverview,products:r=>cfgCatalog(r,'products'),categories:r=>cfgCatalog(r,'categories'),staff:cfgStaff,sectors:cfgSectors,tables:cfgTables,branding:cfgBranding,screens:cfgScreens,links:cfgLinks,preview:cfgCardPreview};
    app.innerHTML=cfgShell(r,page,views[page](r));
    if(['products','categories'].includes(page))bindCatalogPlaylists(r);
    return;
  }
  if(route.page==='client'||route.page==='display')return operationalRender();
  const m=currentStaff(r);
  if(!m?.active||location.hash==='#login'){app.innerHTML=renderLogin(r);return;}
  role=m.role;
  if(role==='cook'){
    // The original order page finds the first cook; present the signed-in cook first.
    const i=r.staff.indexOf(m);if(i>0){r.staff.splice(i,1);r.staff.unshift(m);}
  }
  operationalRender();
};

document.addEventListener('change',e=>{
  if(e.target.name==='cfg-mobile-page')location.hash=e.target.value;
  if(e.target.name==='cfg-role'){cfgRole=e.target.value;render();}
  if(e.target.closest('#cfg-branding')&&['accent','background'].includes(e.target.name)){
    const form=e.target.form,preview=app.querySelector('.mini-preview');
    if(preview){preview.style.background=form.elements.background.value;preview.querySelector('.mini-hero').style.background=form.elements.accent.value;}
    e.target.nextElementSibling.textContent=e.target.value;
  }
});
document.addEventListener('input',e=>{if(e.target.name==='cfg-search'){const start=e.target.selectionStart;cfgSearch=e.target.value;render();const input=app.querySelector('[name="cfg-search"]');input.focus();input.setSelectionRange(start,start);}});
document.addEventListener('submit',async e=>{
  if(e.target.id==='operation-login'){
    e.preventDefault();const data=new FormData(e.target),r=restaurant(),m=r.staff.find(s=>s.login.toLowerCase()===String(data.get('login')).trim().toLowerCase()),hash=await hashPassword(String(data.get('password'))),fallback=await hashPassword('demo123');
    if(!m?.active||hash!==(m.passwordHash||fallback)){const error=app.querySelector('#login-error');error.textContent='Login ou senha de demonstração inválidos, ou acesso inativo.';error.hidden=false;return;}
    enterOperation(m,'orders');
  }
  if(e.target.id==='cfg-branding'){
    e.preventDefault();const data=new FormData(e.target),r=restaurant(),name=String(data.get('name')).trim(),fee=parsePrice(data.get('fee')),logo=String(data.get('logo')).trim(),image=data.get('logo-file');
    const error=app.querySelector('#cfg-brand-error'),fail=text=>{error.textContent=text;error.hidden=false;};
    if(!name||fee===null)return fail('Informe o nome e uma taxa válida.');
    if(logo&&!safeImage(logo))return fail('Use uma URL HTTPS para a logomarca.');
    const save=src=>{Object.assign(r,{name,subtitle:String(data.get('subtitle')).trim(),accent:allowedColor(data.get('accent'),menuPalette.accent),background:allowedColor(data.get('background'),menuPalette.background),callFee:fee,logo:src});persist('Configuração salva na demonstração.');};
    if(image?.size){if(!['image/png','image/jpeg','image/webp'].includes(image.type)||image.size>2*1024*1024)return fail('Envie PNG, JPEG ou WebP de até 2 MB.');const reader=new FileReader();reader.onload=()=>save(reader.result);reader.readAsDataURL(image);}else save(logo||r.logo);
  }
});
// Receive example edits across tabs without making requests to EDS.
if(!localStorage.getItem(storageKey))writeState(state);
render();
</script></body></html>
